x-test-env: &test-env
  ALLOWED_HOSTS: "*"
  ADMIN_EMAILS: ""
  DEBUG: "True"
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_MAIL: "test@example.com"
  MAPQUEST_API_KEY: ""
  CONTACT_MAIL: "test@example.com"
  DB_USER: "enduroller"
  DB_PASSWORD: "jirshIgViax0"
  DB_HOST: "db"
  REDIS_HOST: "redis"
  DEV_SERVER: "True"
  LOCAL_SETTINGS: ".docker"
  TURNSTILE_SITEKEY: ""
  TURNSTILE_SECRET: ""

services:
  django:
    build: 
      context: ./
    volumes:
      - ./:/app
    ports:
      - 8000:29000
    environment:
      ALLOWED_HOSTS: "enduroller.fr,www.enduroller.fr,localhost"
      ADMIN_EMAILS: "puyb@puyb.net"
      DEBUG: "True"
      EMAIL_HOST: "mail.enduroller.fr"
      EMAIL_HOST_USER: "donotreply@enduroller.fr"
      EMAIL_HOST_PASSWORD: "4i3y4Xbsqos6xqKh"
      DEFAULT_FROM_MAIL: "donotreply@enduroller.fr"
      MAPQUEST_API_KEY: "Fmjtd|luub2d6ynd%2C25%3Do5-9u22ha"
      CONTACT_MAIL: "contact@enduroller.fr"
      DB_NAME: "enduroller"
      DB_USER: "enduroller"
      DB_PASSWORD: "jirshIgViax0"
      DB_HOST: "db"
      REDIS_HOST: "redis"
      DEV_SERVER: "True"
      LOCAL_SETTINGS: ".docker"
      TURNSTILE_SITEKEY: ""
      TURNSTILE_SECRET: ""
    depends_on:
      - db
      - redis

  bounce:
    image: node
    command: /srv/app/start-bounce.sh
    volumes:
      - ./:/srv/app
    environment:
      EMAIL_HOST: "mail.enduroller.fr"
      EMAIL_HOST_USER: "donotreply@enduroller.fr"
      EMAIL_HOST_PASSWORD: "4i3y4Xbsqos6xqKh"
      DB_NAME: "enduroller"
      DB_USER: "enduroller"
      DB_PASSWORD: "jirshIgViax0"
      DB_HOST: "db"
    depends_on:
      - db
      - redis

  db:
    image: postgres
    environment:
      POSTGRES_DB: "enduroller"
      POSTGRES_USER: "enduroller"
      POSTGRES_PASSWORD: "jirshIgViax0"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "enduroller"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis

  # --- test-only services, gated behind the "test" profile so they never
  # start on a plain `docker-compose up` --------------------------------
  test:
    profiles: ["test"]
    build:
      context: ./
      args:
        DEBUG: "True"
    volumes:
      - ./:/app
    environment:
      <<: *test-env
      DB_NAME: "enduroller_test"
    depends_on:
      - db
      - redis

  django-e2e:
    profiles: ["test"]
    build:
      context: ./
      args:
        DEBUG: "True"
    volumes:
      - ./:/app
    environment:
      <<: *test-env
      DB_NAME: "enduroller_e2e"
    command: >
      sh -c "./manage.py ensure_database &&
             ./manage.py migrate --noinput &&
             ./manage.py collectstatic --noinput &&
             ./manage.py setup_e2e_data &&
             ./manage.py runserver 0.0.0.0:29000"
    depends_on:
      - db
      - redis

  e2e:
    profiles: ["test"]
    build:
      context: ./
      dockerfile: Dockerfile.e2e
    volumes:
      - ./:/app
    environment:
      BASE_URL: "http://django-e2e:29000"
    depends_on:
      - django-e2e

